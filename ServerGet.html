<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <title>ServerGet</title>
    <script>
        // Hàm trích xuất các tham số truyền qua URL (query string của phương thức GET)
        function getUrlVars() {
            var vars = {};
            var parts = window.location.href.replace(/[?&]+([^=&]+)=([^&#]*)/gi, 
                function(m, key, value) {
                    vars[key] = value;
                });
            return vars;
        }

        // Lấy giá trị của txtten và txtemail truyền từ Form ClientGet sang
        var ten = unescape(getUrlVars()["txtten"]);
        var email = unescape(getUrlVars()["txtemail"]);
    </script>
</head>
<body>

    <form>
        <table border="1">
            <tr>
                <td>User:</td>
                <td id="iduser"></td>
            </tr>
            <tr>
                <td>Email:</td>
                <td id="idemail"></td>
            </tr>
        </table>
    </form>

    <script>
        // Gán dữ liệu nhận được vào các ô tương ứng trên giao diện
        document.getElementById("iduser").innerHTML = ten;
        document.getElementById("idemail").innerHTML = email;
    </script>

</body>
</html>
